# Добавьте этот шаг перед "Build with Buildozer"
- name: Clean Buildozer cache
  run: |
    rm -rf ~/.buildozer
    rm -rf .buildozer

- name: Build with Buildozer
  run: |
    docker run --rm \
      -v "${{ github.workspace }}":/home/user/hostcwd \
      kivy/buildozer:latest android debug
