name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer "cython<3.0"
          
      - name: Build APK
        run: |
          rm -rf .buildozer
          echo "y" | buildozer -v android debug > build.log 2>&1 || true
          
      - name: Show Error (If Failed)
        if: always()
        run: |
          echo "=== ПОСЛЕДНИЕ СТРОКИ ЛОГА ==="
          tail -n 30 build.log
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
